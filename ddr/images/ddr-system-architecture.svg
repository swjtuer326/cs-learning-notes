<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="Noto Sans CJK SC, sans-serif">
  <!-- CPU / SoC 容器 -->
  <rect x="30" y="20" width="600" height="172" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="50" y="46" font-size="16" fill="#1e293b" font-weight="700">CPU / SoC</text>

  <!-- 内存控制器 MC -->
  <rect x="50" y="58" width="560" height="58" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="78" font-size="13" fill="#475569" font-weight="600">内存控制器 (MC)</text>
  <g text-anchor="middle">
    <rect x="80" y="86" width="150" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="155" y="101" font-size="12" fill="#1e293b">仲裁器</text>
    <rect x="250" y="86" width="150" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="325" y="101" font-size="12" fill="#1e293b">调度器</text>
    <rect x="420" y="86" width="150" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="495" y="101" font-size="12" fill="#1e293b">时序控制</text>
  </g>

  <!-- DDR PHY -->
  <rect x="50" y="124" width="560" height="58" rx="6" fill="#e0f2f1" stroke="#0e7490" stroke-width="1"/>
  <text x="70" y="144" font-size="13" fill="#0e7490" font-weight="700">DDR PHY（物理层接口）</text>
  <g text-anchor="middle">
    <rect x="80" y="152" width="150" height="22" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1"/>
    <text x="155" y="167" font-size="12" fill="#0e7490">发送端 TX</text>
    <rect x="250" y="152" width="150" height="22" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1"/>
    <text x="325" y="167" font-size="12" fill="#0e7490">接收端 RX</text>
    <rect x="420" y="152" width="150" height="22" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1"/>
    <text x="495" y="167" font-size="12" fill="#0e7490">DLL / PLL</text>
  </g>

  <!-- DDR 总线 -->
  <line x1="330" y1="192" x2="330" y2="260" stroke="#1e293b" stroke-width="2"/>
  <polygon points="324,258 330,268 336,258" fill="#1e293b"/>
  <rect x="268" y="214" width="124" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330" y="228" font-size="12" fill="#1e293b" font-weight="600" text-anchor="middle">DDR 总线（DQ/DQS/CA）</text>

  <!-- DDR DRAM 容器 -->
  <rect x="30" y="268" width="600" height="180" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <text x="50" y="294" font-size="16" fill="#1e293b" font-weight="700">DDR DRAM 芯片</text>

  <!-- 存储阵列 -->
  <rect x="50" y="306" width="560" height="128" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="326" font-size="13" fill="#475569" font-weight="600">存储阵列（多个 Bank）</text>
  <g text-anchor="middle">
    <rect x="80" y="338" width="150" height="82" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="155" y="358" font-size="12" fill="#1e293b" font-weight="600">Bank 0</text>
    <text x="155" y="380" font-size="11" fill="#64748b">Row × Col</text>
    <text x="155" y="398" font-size="11" fill="#64748b">存储单元阵列</text>
    <rect x="250" y="338" width="150" height="82" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="325" y="358" font-size="12" fill="#1e293b" font-weight="600">Bank 1</text>
    <text x="325" y="380" font-size="11" fill="#64748b">Row × Col</text>
    <text x="325" y="398" font-size="11" fill="#64748b">存储单元阵列</text>
    <rect x="420" y="338" width="150" height="82" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="495" y="358" font-size="12" fill="#1e293b" font-weight="600">Bank N</text>
    <text x="495" y="380" font-size="11" fill="#64748b">Row × Col</text>
    <text x="495" y="398" font-size="11" fill="#64748b">存储单元阵列</text>
  </g>
</svg>