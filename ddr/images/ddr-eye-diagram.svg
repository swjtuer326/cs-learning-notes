<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Noto Sans CJK SC, sans-serif">
  <!-- 背景栅格 -->
  <g stroke="#eef2f7" stroke-width="1">
    <line x1="60" y1="40" x2="600" y2="40"/>
    <line x1="60" y1="120" x2="600" y2="120"/>
    <line x1="60" y1="200" x2="600" y2="200"/>
    <line x1="60" y1="280" x2="600" y2="280"/>
  </g>

  <!-- 叠加波形（多条上升/下降沿构成眼） -->
  <g stroke="#64748b" stroke-width="1.2" fill="none" opacity="0.55">
    <path d="M 80,120 C 160,120 200,70 260,200 C 320,330 380,330 440,200 C 500,70 540,120 620,120"/>
    <path d="M 80,120 C 170,125 210,80 260,200 C 310,320 390,320 440,200 C 490,80 530,115 620,120"/>
    <path d="M 80,120 C 150,115 200,90 260,200 C 330,310 370,310 440,200 C 500,90 550,125 620,120"/>
    <path d="M 80,120 C 175,125 215,70 260,200 C 305,330 395,330 440,200 C 485,70 525,115 620,120"/>
  </g>

  <!-- 眼开口（中心菱形，高亮） -->
  <polygon points="260,200 350,120 440,200 350,280" fill="#0e7490" opacity="0.14"/>
  <polygon points="260,200 350,120 440,200 350,280" fill="none" stroke="#0e7490" stroke-width="1.5"/>

  <!-- 眼高标注 -->
  <line x1="300" y1="120" x2="300" y2="280" stroke="#0e7490" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="294" y1="120" x2="306" y2="120" stroke="#0e7490" stroke-width="1"/>
  <line x1="294" y1="280" x2="306" y2="280" stroke="#0e7490" stroke-width="1"/>
  <text x="314" y="204" font-size="12" fill="#0e7490" font-weight="600">眼高 Eye Height</text>

  <!-- 眼宽标注 -->
  <line x1="260" y1="330" x2="440" y2="330" stroke="#0e7490" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="260" y1="324" x2="260" y2="336" stroke="#0e7490" stroke-width="1"/>
  <line x1="440" y1="324" x2="440" y2="336" stroke="#0e7490" stroke-width="1"/>
  <text x="350" y="348" text-anchor="middle" font-size="12" fill="#0e7490" font-weight="600">眼宽 Eye Width</text>

  <!-- 采样点 -->
  <circle cx="350" cy="200" r="5" fill="#e11d48"/>
  <text x="366" y="196" font-size="12" fill="#e11d48" font-weight="600">采样点</text>

  <!-- 抖动 -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="256" y1="60" x2="256" y2="66"/>
    <line x1="268" y1="62" x2="268" y2="66"/>
    <line x1="256" y1="334" x2="256" y2="340"/>
    <line x1="268" y1="332" x2="268" y2="340"/>
  </g>
  <text x="238" y="56" font-size="11" fill="#94a3b8" text-anchor="end">抖动 Jitter</text>

  <!-- 上下电平 -->
  <line x1="60" y1="120" x2="600" y2="120" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="60" y1="280" x2="600" y2="280" stroke="#cbd5e1" stroke-width="1"/>
  <text x="596" y="112" font-size="11" fill="#94a3b8" text-anchor="end">高电平</text>
  <text x="596" y="296" font-size="11" fill="#94a3b8" text-anchor="end">低电平</text>
</svg>
