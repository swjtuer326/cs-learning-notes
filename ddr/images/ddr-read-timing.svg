<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Noto Sans CJK SC, sans-serif">
  <!-- 坐标与网格 -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="60" y1="70" x2="720" y2="70"/>
    <line x1="60" y1="160" x2="720" y2="160"/>
    <line x1="60" y1="250" x2="720" y2="250"/>
    <line x1="60" y1="330" x2="720" y2="330"/>
  </g>

  <!-- 车道标签 -->
  <text x="24" y="62" font-size="13" fill="#64748b" font-weight="600">CK</text>
  <text x="24" y="152" font-size="13" fill="#64748b" font-weight="600">CMD</text>
  <text x="24" y="242" font-size="13" fill="#64748b" font-weight="600">DQS</text>
  <text x="24" y="322" font-size="13" fill="#64748b" font-weight="600">DQ</text>

  <!-- CK 方波 -->
  <g stroke="#1e293b" stroke-width="1.5">
    <polyline fill="none" points="60,100 60,70 80,70 80,100 100,100 100,70 120,70 120,100 140,100 140,70 160,70 160,100 180,100 180,70 200,70 200,100 220,100 220,70 240,70 240,100 260,100 260,70 280,70 280,100 300,100 300,70 320,70 320,100 340,100 340,70 360,70 360,100 380,100 380,70 400,70 400,100 420,100 420,70 440,70 440,100 460,100 460,70 480,70 480,100 500,100 500,70 520,70 520,100 540,100 540,70 560,70 560,100 580,100 580,70 600,70 600,100 620,100 620,70 640,70 640,100 660,100 660,70 680,70 680,100 700,100 700,70 720,70 720,100"/>
  </g>

  <!-- CMD 波形：ACT / NOP / RD / NOP / PRE -->
  <g stroke="#0e7490" stroke-width="2" fill="none">
    <!-- ACT -->
    <polyline points="90,160 90,145 170,145 170,160"/>
    <!-- RD -->
    <polyline points="330,160 330,145 410,145 410,160"/>
    <!-- PRE -->
    <polyline points="610,160 610,145 690,145 690,160"/>
  </g>
  <text x="130" y="137" text-anchor="middle" font-size="12" fill="#0e7490" font-weight="600">ACT</text>
  <text x="370" y="137" text-anchor="middle" font-size="12" fill="#0e7490" font-weight="600">RD</text>
  <text x="650" y="137" text-anchor="middle" font-size="12" fill="#0e7490" font-weight="600">PRE</text>

  <!-- tRCD 标注 -->
  <line x1="170" y1="185" x2="330" y2="185" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="170" y1="180" x2="170" y2="190" stroke="#64748b" stroke-width="1"/>
  <line x1="330" y1="180" x2="330" y2="190" stroke="#64748b" stroke-width="1"/>
  <text x="250" y="203" text-anchor="middle" font-size="12" fill="#64748b">tRCD（激活→读）</text>

  <!-- DQS：前导码 + 数据选通 -->
  <g stroke="#1e293b" stroke-width="1.5" fill="none">
    <!-- 前导码低电平 -->
    <polyline points="330,250 410,250"/>
    <!-- 选通 -->
    <polyline points="410,250 410,225 430,225 430,275 450,275 450,225 470,225 470,275 490,275 490,225 510,225 510,275 530,275 530,225 550,225 550,275 570,275 570,225 590,225 590,275 610,275 610,250 620,250"/>
  </g>
  <text x="345" y="268" font-size="12" fill="#64748b">前导码</text>

  <!-- DQ：数据 D0-D7 -->
  <g stroke="#0e7490" stroke-width="2" fill="none">
    <polyline points="410,330 410,305 430,305 430,320 450,320 450,290 470,290 470,315 490,315 490,300 510,300 510,315 530,315 530,295 550,295 550,320 570,320 570,300 590,300 590,310 610,310 610,330"/>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="420" y="298">D0</text>
    <text x="440" y="283">D1</text>
    <text x="460" y="308">D2</text>
    <text x="480" y="293">D3</text>
    <text x="500" y="308">D4</text>
    <text x="520" y="288">D5</text>
    <text x="540" y="313">D6</text>
    <text x="560" y="293">D7</text>
  </g>

  <!-- CL 标注 -->
  <line x1="410" y1="345" x2="410" y2="356" stroke="#64748b" stroke-width="1"/>
  <line x1="330" y1="356" x2="410" y2="356" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="330" y1="345" x2="330" y2="356" stroke="#64748b" stroke-width="1"/>
  <text x="370" y="372" text-anchor="middle" font-size="12" fill="#64748b">CL（读→首笔数据）</text>
</svg>
