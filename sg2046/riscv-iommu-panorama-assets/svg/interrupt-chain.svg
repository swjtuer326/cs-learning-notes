<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;font-size:13px;">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="180" fill="#ffffff"/>

  <g transform="translate(10,50)">
    <rect width="120" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="60" y="28" text-anchor="middle" fill="#1f2328" font-weight="600">IOMMU 事件</text>
    <text x="60" y="46" text-anchor="middle" fill="#57606a" font-size="10">FQ 新记录 / PQ 新记录</text>
    <text x="60" y="60" text-anchor="middle" fill="#57606a" font-size="10">CQ 错误 / HPM 溢出</text>
  </g>
  <line x1="130" y1="85" x2="170" y2="85" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <g transform="translate(180,50)">
    <rect width="110" height="70" rx="6" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1.5"/>
    <text x="55" y="30" text-anchor="middle" fill="#0969da" font-weight="700">IPSR</text>
    <text x="55" y="52" text-anchor="middle" fill="#1f2328" font-size="11">对应位置 1</text>
    <text x="55" y="66" text-anchor="middle" fill="#57606a" font-size="10">CIP/FIP/PMIP/PIP</text>
  </g>
  <line x1="290" y1="85" x2="330" y2="85" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <g transform="translate(340,50)">
    <rect width="110" height="70" rx="6" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1.5"/>
    <text x="55" y="30" text-anchor="middle" fill="#0969da" font-weight="700">ICVEC</text>
    <text x="55" y="52" text-anchor="middle" fill="#1f2328" font-size="11">源 → 向量</text>
    <text x="55" y="66" text-anchor="middle" fill="#57606a" font-size="10">CIV/FIV/PMIV/PIV</text>
  </g>
  <line x1="450" y1="85" x2="490" y2="85" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <g transform="translate(500,50)">
    <rect width="130" height="70" rx="6" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="1.5"/>
    <text x="65" y="30" text-anchor="middle" fill="#0969da" font-weight="700">MSI_CFG_TBL</text>
    <text x="65" y="52" text-anchor="middle" fill="#1f2328" font-size="11">向量 → 地址/数据</text>
    <text x="65" y="66" text-anchor="middle" fill="#57606a" font-size="10">ADDR + DATA + CTRL</text>
  </g>
  <line x1="630" y1="85" x2="670" y2="85" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <g transform="translate(680,50)">
    <rect width="80" height="70" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="30" text-anchor="middle" fill="#1f2328" font-weight="600">IMSIC</text>
    <text x="40" y="52" text-anchor="middle" fill="#57606a" font-size="11">接收 MSI</text>
    <text x="40" y="66" text-anchor="middle" fill="#57606a" font-size="11">写中断文件</text>
  </g>
  <line x1="760" y1="85" x2="800" y2="85" stroke="#57606a" stroke-width="1.5" marker-end="url(#arr2)"/>

  <g transform="translate(810,50)">
    <rect width="80" height="70" rx="6" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="40" y="30" text-anchor="middle" fill="#1a7f37" font-weight="700">CPU</text>
    <text x="40" y="52" text-anchor="middle" fill="#1f2328" font-size="11">进入 ISR</text>
    <text x="40" y="66" text-anchor="middle" fill="#57606a" font-size="10">读 IPSR 清位</text>
  </g>

  <text x="450" y="155" text-anchor="middle" fill="#57606a" font-size="12">▲ 软件处理完中断后，写 IPSR 对应位 = 1 清零（RW1C）</text>
</svg>